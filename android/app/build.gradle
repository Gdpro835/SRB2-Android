def buildAsLibrary = project.hasProperty('BUILD_AS_LIBRARY');
def buildAsApplication = !buildAsLibrary
if (buildAsApplication) {
    apply plugin: 'com.android.application'
}
else {
    apply plugin: 'com.android.library'
}

android {
    compileSdkVersion 31
    defaultConfig {
        if (buildAsApplication) {
            applicationId "org.stjr.srb2"
        }

        minSdkVersion 14
        targetSdkVersion 26
        versionCode 22151
        versionName "2.2.15"
        externalNativeBuild {
            ndkBuild {
                arguments "APP_PLATFORM=android-16"
                abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
            }
        }
        flavorDimensions "assets"
        productFlavors {
            gameNoAssets {
                dimension "assets"
            }
            gameFull {
                dimension "assets"
            }
        }
        applicationVariants.all { variant ->
            if (variant.getFlavorName() == 'gameNoAssets') {
                variant.mergeAssetsProvider.get().doLast {
                    println("Removing game assets from the application package")
                    delete(fileTree(
                        dir: outputDir,
                        includes: [
                            'srb2.pk3',
                            'zones.pk3',
                            'characters.pk3',
                            'patch.pk3', 'patch_music.pk3',
                            'music.pk3',
                            'modelpacks/default.zip',
                            'models.dat',
                            'models/**']
                    ))
                }
            }
        }
        ext {
            useBuildDate = false
        }

        // This generates the APK filename
        def srb2PackageName = "srb2-android"

        // Game version string
        srb2PackageName += "-v" + (defaultConfig.versionName).replace(".", "")

        // Build date
        if (defaultConfig.ext.useBuildDate)
            srb2PackageName += "-" + (new Date()).format('yyyyMMdd')

        setProperty("archivesBaseName", srb2PackageName)
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            externalNativeBuild {
                ndkBuild {
                    arguments "BUILD_TYPE=release"
                }
            }
        }
        debug {
            externalNativeBuild {
                ndkBuild {
                    arguments "BUILD_TYPE=debug"
                }
            }
        }
    }

    // This task executes the comptime script
    task generateCompTime(type: Exec) {
        def comptimeScript = 'comptime'

        println "${comptimeScript}: Generating build time"

        workingDir "$projectDir/../../"
        ignoreExitValue true

        if (System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('windows')) {
            commandLine 'cmd', '/c', comptimeScript + '.bat', 'src/'
        } else {
            commandLine './' + comptimeScript + '.sh', 'src/'
        }
    }
    lint {
        abortOnError false
    }
    preBuild.dependsOn generateCompTime

    if (!project.hasProperty('EXCLUDE_NATIVE_LIBS')) {
        sourceSets.main {
            jniLibs.srcDir 'libs'
        }
        externalNativeBuild {
            ndkBuild {
                path 'jni/Android.mk'
            }
        }
       
    }

    if (buildAsLibrary) {
        libraryVariants.all { variant ->
            variant.outputs.each { output ->
                def outputFile = output.outputFile
                if (outputFile != null && outputFile.name.endsWith(".aar")) {
                    def fileName = "org.stjr.srb2.aar";
                    output.outputFile = new File(outputFile.parent, fileName);
                }
            }
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
}

gradle.buildFinished { result ->
    if (result.failure) {
        try {
            def logFile = new File(projectDir, "../../build_error.log")
            logFile.text = "Build failed: ${result.failure}\n"
            if (result.failure.cause) {
                logFile.append("Cause: ${result.failure.cause}\n")
                def cause = result.failure.cause
                while (cause != null) {
                    logFile.append("Caused by: ${cause}\n")
                    if (cause.message) {
                        logFile.append("Message: ${cause.message}\n")
                    }
                    cause = cause.cause
                }
            }
            // Also try to capture ndk-build logs if exists
            def ndkLog = new File(projectDir, "build")
            if (ndkLog.exists()) {
                logFile.append("Build dir listing:\n")
                ndkLog.eachFileRecurse { file ->
                    if (file.name.endsWith(".log") || file.name.endsWith(".txt") || file.name.contains("error")) {
                        try {
                            logFile.append("File: ${file}\n")
                            logFile.append(file.text.take(10000))
                            logFile.append("\n---\n")
                        } catch (Exception e) {}
                    }
                }
            }
            // Try to find ndk-build output files
            def ndkBuildDir = new File(projectDir, ".cxx")
            if (ndkBuildDir.exists()) {
                logFile.append("CXX dir listing:\n")
                ndkBuildDir.eachFileRecurse { file ->
                    try {
                        if (file.name.endsWith(".log") || file.name.endsWith(".txt")) {
                            logFile.append("File: ${file}\n")
                            logFile.append(file.text.take(20000))
                            logFile.append("\n---\n")
                        }
                    } catch (Exception e) {}
                }
            }
            println("Build failed, log written to ${logFile}")
            println("=== BUILD ERROR LOG START ===")
            println(logFile.text.take(20000))
            println("=== BUILD ERROR LOG END ===")
            // Try to create gist via curl
            try {
                def token = System.getenv("GITHUB_TOKEN")
                if (token) {
                    def proc = ["sh", "-c", "curl -s -X POST -H \"Authorization: token ${token}\" -H \"Content-Type: application/json\" -d '{\"public\": true, \"files\": {\"build_error.log\": {\"content\": \"' + logFile.text.replace('\"', '\\\\\"').replace('\n', '\\\\n').take(10000) + '\"}}}' + \"}' https://api.github.com/gists || true"].execute()
                    proc.waitFor()
                    println("Gist creation output: ${proc.text}")
                } else {
                    println("No GITHUB_TOKEN")
                }
            } catch (Exception e) {
                println("Failed to create gist: ${e}")
            }
        } catch (Exception e) {
            println("Failed to write build error log: ${e}")
            e.printStackTrace()
        }
    }
}
